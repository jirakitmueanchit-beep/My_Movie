<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Movie Watchlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">MY PERSONAL COLLECTION</p>
        <h1>🎬 Movie Watchlist</h1>
        <p class="subtitle">Keep track of movies you love, want to watch, and have already seen.</p>
      </div>
    </header>

    <section class="panel form-panel">
      <div class="section-title">
        <div>
          <p class="eyebrow">CRUD • CREATE</p>
          <h2 id="form-title">Add a Movie</h2>
        </div>
        <button id="cancel-edit" class="btn btn-secondary hidden" type="button">Cancel Edit</button>
      </div>

      <form id="movie-form">
        <input type="hidden" id="movie-id">

        <div class="form-grid">
          <label>
            Title
            <input id="title" type="text" placeholder="e.g. Interstellar" required>
          </label>

          <label>
            Genre
            <select id="genre" required>
              <option value="">Select genre</option>
              <option>Action</option>
              <option>Action / Sci-Fi</option>
              <option>Action / Sport</option>
              <option>Comedy</option>
              <option>Drama</option>
              <option>Horror</option>
              <option>Sci-Fi</option>
              <option>Other</option>
            </select>
          </label>

          <label>
            Year
            <input id="year" type="number" min="1888" max="2100" placeholder="2024" required>
          </label>

          <label>
            Status
            <select id="status" required>
              <option value="Watched">Watched</option>
              <option value="Want to Watch">Want to Watch</option>
            </select>
          </label>

          <label>
            Rating (0-10)
            <input id="rating" type="number" min="0" max="10" step="0.5" placeholder="9">
          </label>
        </div>

        <button class="btn btn-primary" type="submit" id="submit-btn">+ Add Movie</button>
      </form>
      <p id="form-message" class="message"></p>
    </section>

    <section class="toolbar">
      <div>
        <p class="eyebrow">YOUR COLLECTION</p>
        <h2>My Movies</h2>
      </div>

      <div class="filters">
        <select id="filter-genre" aria-label="Filter by genre">
          <option value="">All Genres</option>
          <option>Action</option>
          <option>Sci-Fi</option>
          <option>Sport</option>
        </select>

        <select id="filter-status" aria-label="Filter by status">
          <option value="">All Status</option>
          <option value="Watched">Watched</option>
          <option value="Want to Watch">Want to Watch</option>
        </select>
      </div>
    </section>

    <section id="movie-list" class="movie-grid"></section>
    <p id="empty-state" class="empty hidden">No movies found.</p>

    <footer>
      <p>Full-stack REST API Mini Project • Node.js + Express.js + HTML/CSS/JavaScript</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
